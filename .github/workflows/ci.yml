name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt, vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go test
        run: go test -count=1 ./...
      - name: go test -race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Build
        shell: bash
        run: |
          exe=""; [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          go build -trimpath -o "./bin/logrecv${exe}" .
      - name: Smoke test CLI
        shell: bash
        run: |
          exe=""; [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          bin="./bin/logrecv${exe}"
          export LOGRECV_CONFIG="$RUNNER_TEMP/logrecv-ci/config.json"
          "$bin" version
          "$bin" path
          "$bin" init
          "$bin" show -json > /dev/null
          "$bin" show -color always
          if "$bin" init 2>/dev/null; then
            echo "init must refuse to overwrite without -f"; exit 1
          fi
          "$bin" init -f

  cross-build:
    name: Cross-compile all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build every target
        run: bash .github/scripts/build-release.sh "ci-${GITHUB_SHA::7}" dist
